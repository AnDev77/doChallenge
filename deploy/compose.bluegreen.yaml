services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-doChallenge}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [internal]

  api-blue:
    image: ${API_BLUE_IMAGE:?API_BLUE_IMAGE is required}
    restart: unless-stopped
    environment: &api_environment
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-doChallenge}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      APP_AUTH_ALLOWED_ORIGINS: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      APP_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${WEB_ORIGIN:?WEB_ORIGIN is required}
    depends_on: &api_dependencies
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  api-green:
    image: ${API_GREEN_IMAGE:?API_GREEN_IMAGE is required}
    restart: unless-stopped
    environment: *api_environment
    depends_on: *api_dependencies
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.bluegreen.conf:/etc/nginx/nginx.conf:ro
      - ./runtime:/etc/nginx/active:ro
      - ./acme-webroot:/var/www/certbot:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      api-blue:
        condition: service_healthy
      api-green:
        condition: service_healthy
    networks: [internal]

  nginx-standby:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8444:443"]
    volumes:
      - ./nginx.bluegreen.conf:/etc/nginx/nginx.conf:ro
      - ./runtime-standby:/etc/nginx/active:ro
      - ./acme-webroot:/var/www/certbot:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      api-blue:
        condition: service_healthy
      api-green:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  mysql_data:
