# Disposable CI only; never use on EC2.
services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    networks: [internal]
    ports: ["127.0.0.1:8025:8025"]
  api-blue:
    environment:
      SPRING_PROFILES_ACTIVE: prod,smoke
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      mailpit:
        condition: service_started
  api-green:
    environment:
      SPRING_PROFILES_ACTIVE: prod,smoke
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      mailpit:
        condition: service_started
