# Test-only overlay. Production compose remains the deployment source of truth.
services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    networks: [internal]
    ports:
      - "127.0.0.1:8025:8025"

  api:
    environment:
      SPRING_PROFILES_ACTIVE: prod,smoke
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      mailpit:
        condition: service_started
