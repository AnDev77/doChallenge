services:
  mysql:
    image: mysql:8.4
    mem_limit: 768m
    environment:
      MYSQL_DATABASE: doChallenge
      MYSQL_USER: shockgraph
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [private]
  redis:
    image: redis:7.4-alpine
    mem_limit: 128m
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [private]
  api:
    image: ${CANDIDATE_IMAGE:?required}
    mem_limit: 768m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=55
      DB_HOST: mysql
      DB_NAME: doChallenge
      DB_USER: shockgraph
      DB_PASSWORD: ${DB_PASSWORD:?required}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?required}
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 587
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MAIL_FROM: candidate@example.invalid
      APP_AUTH_ALLOWED_ORIGINS: https://shockgraph-web.vercel.app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [private]
networks:
  private:
    internal: true
volumes:
  mysql_data:
