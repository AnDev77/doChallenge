spring:
  datasource:
    url: jdbc:h2:mem:fitmeet-integration;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:integration-data.sql

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 1025

logging:
  level:
    org.hibernate.SQL: debug
