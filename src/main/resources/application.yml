spring:
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: doChallenge-backend

server:
  port: 8080

app:
  briefing:
    ingestion:
      run-once: false
      user-agent: ${SEC_USER_AGENT:}
      raw-directory: ${BRIEFING_RAW_DIRECTORY:./data/sec-filings}
      lookback-days: 30
      max-filings: 5
    upstream-origin: ${BRIEFING_UPSTREAM_ORIGIN:}
    internal-token: ${BRIEFING_INTERNAL_TOKEN:}
  mail:
    from: ${MAIL_FROM:}
  jwt:
    secret: ${JWT_SECRET:doChallenge-local-development-secret-key-change-me}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
