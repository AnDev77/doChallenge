spring:
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME:doChallenge}?serverTimezone=UTC&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
