name: 이메일 가입 품질 검사
on:
  pull_request:
  workflow_dispatch:
    inputs:
      send_test_mail:
        description: 'MAIL_TEST_TO에 연결 시험 메일 1통 발송 (받은편지함 확인 별도)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 전체 시험과 실행 JAR 빌드
        run: bash ./gradlew test bootJar --no-daemon
      - name: 시험 수와 실행 JAR 확인
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, zipfile
          roots = [ET.parse(p).getroot() for p in glob.glob('build/test-results/test/TEST-*.xml')]
          assert roots
          print({k: sum(int(r.get(k, 0)) for r in roots) for k in ['tests', 'failures', 'errors', 'skipped']})
          redis = [r for r in roots if r.get('name', '').endswith('EmailProofRedisIntegrationTest')]
          assert len(redis) == 1 and int(redis[0].get('tests', 0)) >= 5
          assert int(redis[0].get('skipped', 0)) == 0
          jars = [p for p in glob.glob('build/libs/*.jar') if not p.endswith('-plain.jar')]
          assert len(jars) == 1
          with zipfile.ZipFile(jars[0]) as z:
            assert 'BOOT-INF/classes/com/fitmeet/auth/presentation/response/EmailVerificationResponse.class' in z.namelist()
            assert not any('SmtpDeliverySmoke' in name for name in z.namelist())
          print('Redis 통합 시험 실행과 가입 응답 JAR 포함 확인')
          PY
  smtp-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.send_test_mail
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: smtp-delivery-smoke
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 비밀값 없이 시험 프로그램 준비
        run: bash ./gradlew testClasses --no-daemon
      - name: 지정 수신처로 1회 발송
        env:
          MAIL_SMOKE_CONFIRM: 'true'
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TEST_TO: ${{ secrets.MAIL_TEST_TO }}
        run: bash ./gradlew --quiet smtpDeliverySmoke --no-daemon
